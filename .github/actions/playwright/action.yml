# PR 17 (CN-023) — Playwright for the device gate and the end-to-end checks, outside the workspace (no lockfile change;
# the tools find it through NODE_PATH=<prefix>/node_modules). Chromium comes from the cache (keyed on the Playwright
# version); its system libraries are installed on every run, because a fresh runner never has them.
# Updated 11 Nov 2026 (PR 17 follow-up): the system-library install (apt-get under the hood) retries, with backoff,
# because the runner's apt mirror (azure.archive.ubuntu.com) has transient DNS outages that failed this one step on
# otherwise-green runs. A sustained outage does not make apt-get fail fast — it can hang for minutes walking every
# mirror/component before erroring — so each attempt is capped at 120s with `timeout`, and the attempt count/backoff
# (3 tries, 20s/60s) is sized so the whole loop's worst case (3*120s + 20s + 60s = 7 min) stays well under this
# action's callers' job timeouts (sign-in e2e 20 min, device-gate-shard 30 min): a still-down mirror now fails the
# step cleanly and quickly instead of running the retries into the job's own cancellation.
name: Playwright and Chromium
description: npm-installs playwright into a prefix, Chromium from the cache, then its system libraries
inputs:
  version:
    description: Playwright version (the workflow's PLAYWRIGHT_VERSION)
    required: true
  prefix:
    description: Folder to npm-install playwright into (NODE_PATH is <prefix>/node_modules)
    required: true
runs:
  using: composite
  steps:
    - name: Playwright package
      shell: bash
      env:
        PW_VERSION: ${{ inputs.version }}
        PW_PREFIX: ${{ inputs.prefix }}
      run: npm install --prefix "$PW_PREFIX" --no-save --no-audit --no-fund "playwright@$PW_VERSION"
    - name: Chromium from the cache
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ inputs.version }}
    - name: Chromium (only when the cache had none)
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      env:
        PW_PREFIX: ${{ inputs.prefix }}
      run: '"$PW_PREFIX/node_modules/.bin/playwright" install chromium'
    - name: Chromium's system libraries
      shell: bash
      env:
        PW_PREFIX: ${{ inputs.prefix }}
      run: |
        backoffs=(20 60)
        attempt=1
        max_attempts=3
        attempt_timeout=120
        until timeout "$attempt_timeout" "$PW_PREFIX/node_modules/.bin/playwright" install-deps chromium; do
          status=$?
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "install-deps chromium failed after $attempt attempts (last exit $status; 124 means it hit the ${attempt_timeout}s per-attempt cap, e.g. a still-down apt mirror)" >&2
            exit 1
          fi
          wait_s="${backoffs[$((attempt - 1))]}"
          echo "install-deps chromium failed (attempt $attempt/$max_attempts, exit $status) — retrying in ${wait_s}s" >&2
          sleep "$wait_s"
          attempt=$((attempt + 1))
        done
