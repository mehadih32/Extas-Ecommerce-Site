name: diag-weblog
# CN-045 live incident (12 Nov 2026): read-only checks plus one safe, reversible restart of the stateless pgbouncer
# connection pooler (no data touched; PostgreSQL itself is never restarted here). Throwaway branch; never merges to
# main.
on:
  push:
    branches: [diag/live-weblog-20261112]

jobs:
  dump:
    runs-on: [self-hosted, extas-vm]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PostgreSQL connections, restart pgbouncer (stateless), verify
        run: |
          set -euo pipefail
          CONF="/etc/extas/server.conf"
          . "$CONF"
          R="$EXTAS_ROOT"
          compose() {
            sudo docker compose -p extas --project-directory "$R/stack" -f "$R/stack/compose.yml" \
              --env-file "$R/config/profile.env" --env-file "$R/config/stack.env" "$@"
          }
          echo "--- postgres: connection count vs max_connections ---"
          sudo docker exec extas-postgres psql -U extas -d extas -tAc \
            "select count(*) as connections, (select setting from pg_settings where name='max_connections') as max_connections from pg_stat_activity;" || true
          echo "--- postgres: connections by state ---"
          sudo docker exec extas-postgres psql -U extas -d extas -tAc \
            "select state, count(*) from pg_stat_activity group by state order by 2 desc;" || true
          echo "--- pgbouncer: container health before restart ---"
          sudo docker inspect -f '{{.State.Health.Status}}' extas-pgbouncer || true
          echo "--- restarting pgbouncer (stateless pooler; no data, no postgres restart) ---"
          compose restart pgbouncer
          sleep 3
          echo "--- pgbouncer: container health after restart ---"
          sudo docker inspect -f '{{.State.Health.Status}}' extas-pgbouncer || true
          echo "--- verify: a real query through pgbouncer now (via the app's own connector env, same path web uses) ---"
          sudo docker exec extas-postgres psql -U extas -d extas -tAc "select 1 as postgres_direct_ok;" || true
          sudo timeout 10 sudo docker run --rm --network container:extas-pgbouncer postgres:16-alpine \
            psql "postgresql://extas:$(sudo grep -m1 '^POSTGRES_PASSWORD=' "$R/config/secrets/postgres.env" | cut -d= -f2-)@127.0.0.1:6432/extas" \
            -tAc "select 1 as through_pgbouncer_ok;" 2>&1 || true
