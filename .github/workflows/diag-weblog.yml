name: diag-weblog
# CN-045 live incident (12 Nov 2026): the pgbouncer restart fixed sign-in briefly, then the same cached auth-failure
# came back ~6 minutes later. Read-only checks to find what is actually breaking pgbouncer's connection to Postgres
# repeatedly. Throwaway branch; never merges to main.
on:
  push:
    branches: [diag/live-weblog-20261112]

jobs:
  dump:
    runs-on: [self-hosted, extas-vm]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check container stability, restarts, host resources, postgres' own log
        run: |
          set -euo pipefail
          echo "--- docker ps: postgres, pgbouncer, web, worker (status + restart count + started-at) ---"
          for c in extas-postgres extas-pgbouncer; do
            echo "== $c =="
            sudo docker inspect -f 'status={{.State.Status}} restarts={{.RestartCount}} started={{.State.StartedAt}} oom={{.State.OOMKilled}} exitcode={{.State.ExitCode}} health={{.State.Health.Status}}' "$c" 2>&1 || true
          done
          echo "--- host memory ---"
          free -h
          echo "--- host load / cpu ---"
          uptime
          nproc
          echo "--- docker stats (one shot) ---"
          sudo docker stats --no-stream --format '{{.Name}}: cpu={{.CPUPerc}} mem={{.MemUsage}} ({{.MemPerc}})' | grep -E 'extas-postgres|extas-pgbouncer|extas-app' || true
          echo "--- postgres' own log, last 10 min, errors/fatal/restart/checkpoint-warnings ---"
          sudo docker logs extas-postgres --since 15m 2>&1 | grep -iE "FATAL|ERROR|PANIC|could not|terminat|restart|out of memory|too many connections" | tail -100 || true
          echo "--- pgbouncer's own log, last 15 min ---"
          sudo docker logs extas-pgbouncer --since 15m 2>&1 | tail -150 || true
          echo "--- disk on the data volumes ---"
          df -h / /var/lib/docker 2>/dev/null || true
          echo "--- how many web/worker containers running right now (today's deploy churn can leave old ones) ---"
          sudo docker ps --format '{{.Names}} {{.Status}}' | grep -E 'extas-app|web-|worker-' || true
          sudo docker ps -a --format '{{.Names}} {{.Status}}' | wc -l
