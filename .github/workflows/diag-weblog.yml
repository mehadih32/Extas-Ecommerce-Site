name: diag-weblog
# CN-045: pgbouncer logs show continuous "connect failed" to 172.18.0.3:5432 -- postgres itself is healthy and has
# no errors, so this looks like pgbouncer holding a stale resolved IP for postgres after postgres was recreated at
# some point today. A plain restart fixed it for ~6 minutes then it broke again, meaning postgres's IP likely moved
# again since. This checks postgres's current IP + restart history, then force-recreates (not just restarts)
# pgbouncer so it starts clean and re-resolves. Throwaway branch; never merges to main.
on:
  push:
    branches: [diag/live-weblog-20261112]

jobs:
  dump:
    runs-on: [self-hosted, extas-vm]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose the IP mismatch, then force-recreate pgbouncer
        run: |
          set -euo pipefail
          CONF="/etc/extas/server.conf"
          . "$CONF"
          R="$EXTAS_ROOT"
          compose() {
            sudo docker compose -p extas --project-directory "$R/stack" -f "$R/stack/compose.yml" \
              --env-file "$R/config/profile.env" --env-file "$R/config/stack.env" "$@"
          }
          echo "--- postgres: restart history + current IP ---"
          sudo docker inspect -f 'restarts={{.RestartCount}} started={{.State.StartedAt}} id={{.Id}}' extas-postgres
          sudo docker inspect -f 'postgres current IP: {{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' extas-postgres
          echo "--- pgbouncer: restart history + current IP + networks ---"
          sudo docker inspect -f 'restarts={{.RestartCount}} started={{.State.StartedAt}}' extas-pgbouncer
          sudo docker inspect -f 'pgbouncer networks: {{range $k,$v := .NetworkSettings.Networks}}{{$k}}={{$v.IPAddress}} {{end}}' extas-pgbouncer
          echo "--- what pgbouncer is actually trying to reach (its own log says 172.18.0.3:5432) ---"
          echo "--- docker network ls (any duplicate/overlapping subnets from today's CI churn) ---"
          sudo docker network ls
          echo "--- force-recreating pgbouncer (stateless; postgres untouched; a fresh container, fresh DNS) ---"
          compose up -d --force-recreate --no-deps pgbouncer
          sleep 3
          sudo docker inspect -f 'after recreate: restarts={{.RestartCount}} started={{.State.StartedAt}} health={{.State.Health.Status}}' extas-pgbouncer
          sudo docker inspect -f 'pgbouncer new IP: {{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' extas-pgbouncer
          echo "--- verify: real query through pgbouncer right after recreate ---"
          sudo docker exec extas-postgres psql -U extas -d extas -tAc "select 1 as postgres_direct_ok;"
          sleep 2
          sudo docker logs extas-pgbouncer --since 10s 2>&1 | tail -20
