name: diag-weblog
# CN-045: ruled out DNS/IP staleness -- postgres's IP (172.18.0.3) never changed, 0 restarts all day. Pgbouncer's
# "connect failed" to that exact, correct IP, with nothing in postgres's own log, points at the network path itself:
# today had an extreme number of short-lived connections (CI's own db jobs + many deploy/migrate attempts + pgbouncer's
# own rapid retry loop), which can exhaust the kernel's connection-tracking table (conntrack) and start silently
# dropping new connections between containers on the same bridge. This checks that. Throwaway branch; never merges.
on:
  push:
    branches: [diag/live-weblog-20261112]

jobs:
  dump:
    runs-on: [self-hosted, extas-vm]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check kernel conntrack table usage
        run: |
          set -euo pipefail
          echo "--- conntrack: current count vs max ---"
          cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null || sudo sysctl net.netfilter.nf_conntrack_count || true
          cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null || sudo sysctl net.netfilter.nf_conntrack_max || true
          echo "--- conntrack table, entries touching the extas bridge (172.18.0.x) ---"
          sudo conntrack -L 2>/dev/null | grep -c '172.18.0.' || echo "conntrack cli not installed"
          echo "--- dmesg: any 'nf_conntrack: table full' drops ---"
          sudo dmesg -T 2>/dev/null | grep -i "conntrack" | tail -20 || echo "no dmesg access or no matches"
          echo "--- docker daemon: total containers ever created today (churn indicator) ---"
          sudo docker ps -a --format '{{.CreatedAt}}' | grep "2026-11-12" | wc -l
          echo "--- current established connections count on the extas bridge interface ---"
          ip -s link show 2>/dev/null | grep -A5 'br-' | head -40 || true
