# Deploy to new.extas.com.bd (PR 4, PR 17; START-HERE step 2). Runs ON the VM through the self-hosted runner (CN-003)
# after CI passed on main. The images are built on the VM (no registry, no secrets leave the server), then
# infra/deploy/deploy.sh migrates the database (schema, then settings, PR 496) and does blue/green: the new version
# starts next to the old one, is smoke-tested, Caddy switches with a graceful reload, and any failure keeps or gives
# back the traffic to the old version (automatic rollback).
# Before the build, README.md and docs/ are copied to the server, one way, stamped with the commit (PR 594, CN-011).
# After every deploy, success or failure, a short report (commit, time in EXTAS_TIMEZONE, result, migration, the public
# health check on the preview host, the docs copy, the failing step in plain English) is committed to
# docs/reports/server/deploy-latest.md and one line is appended to deploy-history.md. No loop: that commit carries
# [skip ci], ci.yml ignores pushes that only touch docs/reports/, and a push made with the workflow's own token
# starts no workflow anyway; no ci run means no deploy. No secret, password, connection string or e-mail is in it.
# CN-016: after the switch, the smoke test opens every built page signed out and as the read-only check account, on a
# phone and a desktop screen, through Cloudflare (infra/deploy/smoke.sh). A failure puts the previous version back
# automatically and fails this run; its report and pictures are committed to docs/reports/smoke/latest/.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Go back to the previous version"
        type: boolean
        default: false

concurrency:
  group: extas-vm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, extas-vm]
    # ~~30~~ 40 minutes (PR 621): the build, the migration, the ERP acceptance (at most ERP_ACCEPTANCE_TIMEOUT_MIN) and the
    # new colour all fit, so the job is never cut off between the migration and the switch.
    timeout-minutes: 40
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ env.SHA }}

      # PR 4 follow-up (31 Oct): / reached 97% and the build killed the runner twice. First the clean-up (build cache
      # above DOCKER_BUILD_CACHE_KEEP_GB, untagged layers, old extas images but never the live or rollback ones, runner
      # logs, apt cache, journal; infra/deploy/disk-tidy.sh), then the check: with less than DISK_ROOT_MIN_FREE_GB free on
      # / nothing is built and the run fails here with the reason in the deploy report. A rollback builds nothing, so it
      # only tidies and never stops on it.
      - name: Free space on the main disk (clean up, then check)
        id: disk
        run: |
          mode=--guard
          if [ "${{ inputs.rollback }}" = true ]; then mode=--tidy; fi
          sudo env EXTAS_CONFIG_FILE="$PWD/infra/config/server.conf" bash infra/deploy/disk-tidy.sh "$mode" "$RUNNER_TEMP/disk.json"

      # PR 594 (CN-011): README.md and the whole docs/ folder onto the server, one way (repo → server), stamped with the
      # commit: $EXTAS_ROOT/docs/<sha12>/ with a COMMIT file, `current` pointing at it, the newest DOCS_KEEP_VERSIONS
      # kept. The admin's register and Blueprint tabs read it (app.yml mounts it read-only), the backups bundle it.
      # This checkout's server.conf (DOCS_KEEP_VERSIONS can be newer than the installed copy). Never stops a deploy.
      - name: Copy the docs to the server
        id: docs
        continue-on-error: true
        run: sudo env EXTAS_CONFIG_FILE="$PWD/infra/config/server.conf" bash infra/deploy/docs-sync.sh "$SHA" "$PWD"

      # Two images from one Dockerfile: the app, and the one-shot migrate image (prisma migrate deploy + settings sync).
      - name: Build the images on the server
        id: build
        if: ${{ !inputs.rollback }}
        run: |
          sudo docker build -f apps/web/Dockerfile --target migrate --build-arg GIT_SHA="$SHA" -t "extas-migrate:${SHA::12}" .
          sudo docker build -f apps/web/Dockerfile --build-arg GIT_SHA="$SHA" -t "extas-web:${SHA::12}" .

      # The database is migrated first; a failed migration stops here with the live version untouched.
      # EXTAS_DEPLOY_RUN_ID tags deploy.sh's record with this run, so the report never shows an older run's result.
      # PR 621 (CN-029; qa-gate B2): between the migration and the new colour, deploy.sh runs the ERP v6 acceptance
      # against the demo ERP with the NEW version on the migrated database (infra/deploy/erp-acceptance.sh; the report
      # goes to ERP_ACCEPTANCE_OUT). ~~It ran as its own step before the migration.~~ A failed check stops the release
      # before the switch (the live version keeps the traffic); waiting for the demo key, a demo ERP that cannot be
      # reached or refuses the key, a run not finished in time or one that could not read the database is reported and
      # lets the release go.
      - name: Migrate the database, ERP acceptance, then blue/green switch (automatic rollback on failure)
        id: deploy
        run: |
          if [ "${{ inputs.rollback }}" = true ]; then
            sudo env EXTAS_DEPLOY_RUN_ID="$GITHUB_RUN_ID" bash infra/deploy/deploy.sh rollback
          else
            sudo env EXTAS_DEPLOY_RUN_ID="$GITHUB_RUN_ID" ERP_ACCEPTANCE_OUT="$RUNNER_TEMP/erp-acceptance" ERP_ACCEPTANCE_TIMEOUT_MIN=8 bash infra/deploy/deploy.sh "extas-web:${SHA::12}" "extas-migrate:${SHA::12}"
          fi

      # Through Cloudflare, like a visitor: https://<staging host>/api/health with the preview login (read on the
      # server, never printed; only the HTTP code, ok, commit and colour come out). Also after a failed deploy, to show
      # whether the old version still answers.
      - name: Health check on the preview host
        id: health
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          sudo bash infra/deploy/deploy.sh public-health | tee "$RUNNER_TEMP/health.json"
          jq -e '.ok and .code == 200' "$RUNNER_TEMP/health.json" >/dev/null

      # CN-016: every built page as a customer and as the admin, phone and desktop. Any error screen, console error or
      # failed request fails it; then the previous version comes back (next step) and the run fails at the end.
      - name: Smoke test (every page, signed out and as the admin)
        id: smoke
        if: steps.deploy.outcome == 'success' && !inputs.rollback
        continue-on-error: true
        run: sudo env EXTAS_CONFIG_FILE="$PWD/infra/config/server.conf" SMOKE_ROLLS_BACK=1 bash infra/deploy/smoke.sh "$RUNNER_TEMP/smoke" "after deploy" "$SHA"

      # The deploy's own record is kept for the report first (the rollback writes its own).
      - name: Put the previous version back (the smoke test failed)
        id: smoke_rollback
        if: steps.smoke.outcome == 'failure'
        run: |
          sudo cp /srv/extas/state/last-deploy.json "$RUNNER_TEMP/deploy-record.json" 2>/dev/null || true
          sudo env EXTAS_DEPLOY_RUN_ID="$GITHUB_RUN_ID" bash infra/deploy/deploy.sh rollback

      - name: What happened
        if: always()
        run: sudo cat /srv/extas/state/last-deploy.json 2>/dev/null || true

      # Written from this run's own record first, then the workspace moves to the newest main for the commit. Each
      # attempt starts from the newest main, so it never conflicts with another report.
      - name: Commit the deploy report
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          DISK: ${{ steps.disk.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          SMOKE_ROLLBACK: ${{ steps.smoke_rollback.outcome }}
          ROLLBACK: ${{ inputs.rollback && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          out="$RUNNER_TEMP/deploy-report"
          sudo rm -rf "$out"
          if [ ! -f infra/deploy/deploy-report.sh ]; then
            git fetch -q origin main
            git checkout -q FETCH_HEAD -- infra/deploy/deploy-report.sh
          fi
          rec=(); [ -f "$RUNNER_TEMP/deploy-record.json" ] && rec=(DEPLOY_JSON="$RUNNER_TEMP/deploy-record.json")
          sudo env SHA="$SHA" RUN_ID="$GITHUB_RUN_ID" RUN_URL="$RUN_URL" ROLLBACK="$ROLLBACK" CHECKOUT="$CHECKOUT" \
            DISK="${DISK:-}" DISK_JSON="$RUNNER_TEMP/disk.json" BUILD="${BUILD:-skipped}" DEPLOY="${DEPLOY:-skipped}" DOCS="${DOCS:-}" HEALTH_JSON="$RUNNER_TEMP/health.json" \
            SMOKE="${SMOKE:-}" SMOKE_ROLLBACK="${SMOKE_ROLLBACK:-}" "${rec[@]}" \
            bash infra/deploy/deploy-report.sh "$out"
          smoke="$RUNNER_TEMP/smoke"; [ -f "$smoke/README.md" ] && sudo chown -R "$(id -u):$(id -g)" "$smoke"
          acc="$RUNNER_TEMP/erp-acceptance"; [ -f "$acc/README.md" ] && sudo chown -R "$(id -u):$(id -g)" "$acc"
          sudo chown -R "$(id -u):$(id -g)" "$out"
          cat "$out/deploy-latest.md"
          git config user.name "extas-vm"
          git config user.email "extas-vm@users.noreply.github.com"
          h=docs/reports/server/deploy-history.md
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p docs/reports/server
            cp "$out/deploy-latest.md" docs/reports/server/deploy-latest.md
            [ -f "$h" ] || cp "$out/deploy-history.head" "$h"
            cat "$out/deploy-history.line" >> "$h"
            git add docs/reports/server/deploy-latest.md "$h"
            if [ -f "$smoke/README.md" ]; then
              rm -rf docs/reports/smoke/latest && mkdir -p docs/reports/smoke && cp -r "$smoke" docs/reports/smoke/latest
              git add -A docs/reports/smoke/latest
            fi
            if [ -f "$acc/README.md" ]; then
              rm -rf docs/reports/erp-acceptance/latest && mkdir -p docs/reports/erp-acceptance && cp -r "$acc" docs/reports/erp-acceptance/latest
              git add -A docs/reports/erp-acceptance/latest
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "deploy report: $(cat "$out/summary") [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 2))
          done
          exit 1

      # The fix comes before any new work (CN-016): a run whose smoke test failed is red even after the rollback.
      - name: Fail when the smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "The smoke test failed after the deploy; the previous version was put back. See docs/reports/smoke/latest/README.md."
          exit 1
