# S0A — server setup as code (PR 1–10, 601, 604). Runs ON the VM through the self-hosted runner (CN-003).
# Idempotent: every push that changes the server code re-runs it safely. The machine report (no secrets) is
# committed back to docs/reports/server/ so later sessions can read the server's state without SSH.
name: server-setup

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these steps (comma list, e.g. stack,monitor). Empty = all."
        required: false
        default: ""
      data_disk:
        description: "Data disk device, only if auto-detect reports it is unsure (e.g. /dev/nvme0n2)"
        required: false
        default: ""
      k6_force:
        description: "Re-measure the k6 baseline"
        type: boolean
        default: false
      rotate_staging_password:
        description: "Make a new preview (new.extas.com.bd) password. The owner reads it on the VM, see docs/owner/PREVIEW-LOGIN.md"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "infra/server/**"
      - "infra/stack/**"
      - "infra/config/**"
      - ".github/workflows/server-setup.yml"

# R1 ops review (M1): ~~its own group (a newer setup replaces only an older waiting setup (both apply the newest main))~~;
# ~~the shared `extas-vm` group~~ let any other VM workflow cancel it while it waited. R2 ops review (M1): one group for
# every setup still let a push to infra/** cancel a waiting setup started by hand with rotate_staging_password or
# data_disk, so every run is its own group now (extas-vm-setup-<run id>) and none is ever cancelled. One job at a time
# on the VM comes from the single runner (see deploy.yml).
concurrency:
  group: extas-vm-setup-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # R1 ops review (M6): start a deploy after the image check had to reset the store

jobs:
  setup:
    runs-on: [self-hosted, extas-vm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Server setup (idempotent)
        id: setup
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
          DATA_DISK: ${{ inputs.data_disk }}
          K6_FORCE: ${{ inputs.k6_force && 'yes' || 'no' }}
          ROTATE_STAGING: ${{ inputs.rotate_staging_password && 'yes' || 'no' }}
        run: |
          args=()
          [ -n "$ONLY" ] && args=(--only "$ONLY")
          sudo env EXTAS_DATA_DISK="$DATA_DISK" K6_FORCE="$K6_FORCE" ROTATE_STAGING="$ROTATE_STAGING" \
            GITHUB_SHA="$GITHUB_SHA" bash infra/server/setup.sh "${args[@]}"

      # R1 ops review (M6): when the image check had to set the store aside (infra/server/steps/13-osdisk.sh), every
      # container went with it, the app's too, and a deploy only runs on a merge. A deploy of main starts at once (a
      # workflow_dispatch made with this run's token does start a run); it waits for the runner behind this job.
      - name: Start a deploy when the image store was reset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          sudo test -f /srv/extas/state/store-reset.redeploy || exit 0
          if curl -fsS -m 20 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/actions/workflows/deploy.yml/dispatches" -d '{"ref":"main"}'; then
            sudo rm -f /srv/extas/state/store-reset.redeploy
            echo "::warning::The image store was reset; a deploy of main was started to bring the app back."
          else
            echo "::error::The image store was reset and the deploy could not be started: run deploy.yml by hand."
            exit 1
          fi

      # The preview password is generated on the server and never leaves it: no artifact, no log, no chat.
      # The owner reads it on the VM with `extas-preview-login` (docs/owner/PREVIEW-LOGIN.md).

      # A full run updates latest.md; a partial run (input "only") is kept as its own dated file so latest.md
      # always shows the whole server. Each attempt starts from the newest main, so two runs never conflict.
      - name: Commit the machine report
        if: always()
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -eu
          [ -f /srv/extas/reports/latest.md ] || { echo "no report"; exit 0; }
          git config user.name "extas-vm"
          git config user.email "extas-vm@users.noreply.github.com"
          stamp="$(date +%Y-%m-%d-%H%M)"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p docs/reports/server
            if [ -z "$ONLY" ]; then
              cp /srv/extas/reports/latest.md docs/reports/server/latest.md
              cp /srv/extas/reports/latest.md "docs/reports/server/$stamp-setup.md"
            else
              cp /srv/extas/reports/latest.md "docs/reports/server/$stamp-only-$(echo "$ONLY" | tr -c 'a-z0-9\n' '-').md"
            fi
            git add docs/reports/server
            git diff --cached --quiet && exit 0
            git commit -q -m "server report: $(date '+%Y-%m-%d %H:%M')${ONLY:+ (only $ONLY)}"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1

      - name: Fail if setup needs attention
        if: steps.setup.outcome != 'success'
        run: |
          echo "::error::Server setup needs attention — see docs/reports/server/latest.md"
          exit 1
