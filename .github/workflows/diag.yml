# Throwaway diagnosis (admin sign-in). Read-only: no data is changed. Prints no secret, cookie, IP or e-mail.
name: diag-admin-login
on:
  push:
    branches: ['diag/**']
permissions:
  contents: read
jobs:
  diag:
    runs-on: [self-hosted, extas-vm]
    timeout-minutes: 15
    steps:
      - name: Diagnose
        shell: bash
        run: |
          set -u
          san() { sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g; s/([0-9a-f]{1,4}:){3,7}[0-9a-f]{1,4}/<ip6>/g'; }
          S=/srv/extas/config/secrets
          H=new.extas.com.bd
          PW="$(sudo grep '^STAGING_PASSWORD=' $S/staging.env | cut -d= -f2-)"
          echo "::add-mask::$PW"
          U="$( . /etc/extas/server.conf 2>/dev/null; echo "${EXTAS_STAGING_USER:-extas}")"
          OE="$(sudo grep '^OWNER_EMAIL=' $S/owner-login.env 2>/dev/null | cut -d= -f2-)"; [ -n "$OE" ] && echo "::add-mask::$OE"
          NC=$(mktemp); printf 'user = "%s:%s"\n' "$U" "$PW" > "$NC"; chmod 600 "$NC"
          hdr() { sed -E 's/^(set-cookie: [^=]+=)[^;]*/\1<v>/I' | grep -iE '^(HTTP|location|set-cookie|cf-cache|cache-control|www-auth|x-robots)' | san; }
          echo "== no auth"; for p in /admin/login /admin/products; do echo "-- $p"; curl -sSI "https://$H$p" | hdr; done
          echo "== basic auth"; for p in /admin/login /admin/products /admin /api/admin/auth/me; do echo "-- $p"; curl -sSI -K "$NC" "https://$H$p" | hdr; done
          echo "== login page body markers (basic auth)"; curl -sS -K "$NC" "https://$H/admin/login" | grep -oE 'ad-login|couldn.t load|NEXT_REDIRECT|name="email"|type="password"' | sort | uniq -c
          echo "== preview cookie flow"; J=$(mktemp); curl -sS -o /dev/null -K "$NC" -c "$J" "https://$H/" ; echo "cookies after first: $(awk '!/^#/ && NF{print $6}' "$J" | tr '\n' ' ')"
          curl -sSI -b "$J" "https://$H/admin/login" | hdr
          rm -f "$NC" "$J"
          echo "== containers"; sudo docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | san
          echo "== last good deploy"; sudo cat /srv/extas/state/last-good-deploy.json 2>/dev/null | san; echo
          ls -la /srv/extas/state 2>/dev/null | awk '{print $6,$7,$8,$9}'
          echo "== caddy auth snippet"; sudo sh -c 'grep -l extas_preview /srv/extas/stack/caddy/*.caddy /srv/extas/stack/caddy/* 2>/dev/null' ; sudo docker exec extas-caddy sh -c 'grep -c extas_preview /etc/caddy/* 2>/dev/null' || true
          echo "== database"
          q() { sudo docker exec -i extas-postgres psql -U extas -d extas -At -F ' | ' -c "$1" 2>&1 | san; }
          q 'select id, slug, "createdAt" from "Store" order by id'
          q 'select status, ("passwordSetAt" is null) as must_change, "twoFactorEnabled", "lastLoginAt", "createdAt", "updatedAt" from "StaffUser"'
          q 'select count(*) filter (where "revokedAt" is null and "expiresAt" > now()) as live, count(*) as total, max("lastSeenAt") from "StaffSession"'
          q 'select success, reason, "createdAt" from "StaffLoginEvent" order by "createdAt" desc limit 25'
          q 'select r.key, a."storeId", a."archivedAt" from "StaffRoleAssignment" a join "Role" r on r.id=a."roleId"'
          q '\d "StaffRoleAssignment"'
          echo "== app logs (admin/auth/store/error, last 72h)"
          for c in $(sudo docker ps --format '{{.Names}}' | grep -E 'app' ); do echo "-- $c"; sudo docker logs --since 72h "$c" 2>&1 | grep -iE 'admin|auth|store|error|warn|redirect' | tail -25 | san; done
          echo "== deploy logs"; sudo ls -t /srv/extas/logs 2>/dev/null | head; sudo sh -c 'ls -t /srv/extas/logs/deploy* 2>/dev/null | head -1 | xargs -r tail -40' | san
