# CI on GitHub-hosted runners (PR 17). Heavy jobs move to extas-vm once the app exists.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Machine reports the VM commits back (server-setup, deploy, owner-account) start nothing: no ci, so no deploy
    # (no loop). Their commits also carry [skip ci].
    paths-ignore:
      - "docs/reports/server/**"

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -S warning -e SC2034 infra/server/setup.sh infra/server/lib.sh infra/server/steps/*.sh infra/server/bin/* infra/tests/run.sh infra/bootstrap/install-runner.sh
      - name: Infra unit tests (disk detection, NVMe detection, auto profile)
        run: infra/tests/run.sh
      - name: Compose file is valid
        run: |
          infra/server/bin/extas-profile --cpu 8 --mem-kb 65842000 > /tmp/profile.env
          printf 'EXTAS_ROOT=/srv/extas\nEXTAS_NVME_MOUNT=/mnt/nvme\nEXTAS_STAGING_HOST=example.test\nIMG_POSTGRES=postgres:17\nIMG_REDIS=redis:7.4-alpine\nIMG_MEILI=getmeili/meilisearch:v1.15\nIMG_CADDY=caddy:2.10-alpine\nREDIS_PASSWORD=x\nREDIS_CACHE_MAX_MB=1\nREDIS_QUEUE_MAX_MB=1\nMEILI_MASTER_KEY=x\nMEILI_INDEX_MEM_MB=1\n' > /tmp/stack.env
          sudo mkdir -p /srv/extas/config/secrets && sudo touch /srv/extas/config/secrets/postgres.env
          docker compose -f infra/stack/compose.yml --env-file /tmp/profile.env --env-file /tmp/stack.env config -q
      - name: Caddyfile is valid
        run: |
          mkdir -p /tmp/sites && printf 'root * /srv/www\nfile_server\n' > /tmp/sites/upstream.caddy && : > /tmp/sites/auth.caddy && : > /tmp/sites/noindex.caddy
          docker run --rm -e EXTAS_STAGING_HOST=example.test -v "$PWD/infra/stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/sites:/etc/caddy/sites:ro caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Deploy script and app compose are valid
        run: |
          shellcheck -x -S warning infra/deploy/deploy.sh infra/deploy/deploy-report.sh
          EXTAS_CONFIG_FILE=infra/config/server.conf infra/deploy/deploy.sh upstream blue > /tmp/sites/upstream.caddy
          docker run --rm -e EXTAS_STAGING_HOST=example.test -v "$PWD/infra/stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/sites:/etc/caddy/sites:ro caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          printf 'APP_IMAGE=extas-web:test\nEXTAS_COLOR=blue\nEXTAS_ROOT=/srv/extas\nEXTAS_NVME_MOUNT=/mnt/nvme\nEXTAS_TIMEZONE=Asia/Dhaka\n' > /tmp/app.env
          sudo touch /srv/extas/config/secrets/app.env /srv/extas/config/secrets/app-connections.env
          docker compose -f infra/stack/app.yml --env-file /tmp/profile.env --env-file /tmp/app.env config -q

  # PR 17 — the app: lint, type-check, unit tests, build, the Lighthouse budget (lighthouserc.json, Blueprint V2.1
  # speed targets) and the production image.
  web:
    runs-on: ubuntu-24.04
    env:
      # The Prisma client of the full schema (333 models) costs every type-check about 2.5–3 GB of heap; Node's default
      # limit on the runner is about 2 GB.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Image copies every workspace manifest
        run: |
          missing=0
          for f in packages/*/package.json; do
            grep -qF "COPY $f " apps/web/Dockerfile || { echo "apps/web/Dockerfile does not copy $f"; missing=1; }
          done
          exit $missing
      - name: Fonts are self-hosted (the image build must not download fonts)
        run: |
          if grep -rn "next/font/google" apps/web/src; then echo "use the self-hosted fonts in apps/web/src/fonts"; exit 1; fi
      - name: Hardcode guard (PR 494)
        run: node tools/hardcode-guard.mjs
      # PR 509 — no default, default-pack value or sample value is the owner's own data; the register matches the schema
      # and the installation export can never read a register table or column.
      - name: Owner-data register check (PR 509)
        run: pnpm --filter @extas/seed owner-data:check
      - name: Status data from the register
        run: pnpm status:gen
      # README's "Stages" row must agree with the register's "**Progress: …**" line on every PR and merge.
      - name: README status matches the register
        run: node tools/readme-status.mjs
      # Stage and PR pages (docs/stages) and the README's stage/PR links are generated from the register: they must be
      # current on every PR and merge.
      - name: Stage pages match the register
        run: |
          node tools/docs/gen-stage-pages.mjs --check || { echo "::error::docs/stages or the README links are out of date: run pnpm docs:stages and commit the result"; exit 1; }
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @extas/web build
      - name: Lighthouse budget
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
          npx -y @lhci/cli@0.15.1 autorun
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
      - name: Production image builds
        run: docker build -f apps/web/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t extas-web:ci .
      - name: Migrate image builds (deploy step 0 — schema migrations + settings sync)
        run: docker build -f apps/web/Dockerfile --target migrate --build-arg GIT_SHA="$GITHUB_SHA" -t extas-migrate:ci .

  # PR 13 / 603 — the schema's migrations apply to a real PostgreSQL 17 with pg_trgm (throwaway CI database); then the
  # settings framework's database tests (PR 491–496, 510) and the seed package's (PR 14, 508, 509).
  db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: extas
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: extas
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U extas" --health-interval 2s --health-retries 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
      DATABASE_DIRECT_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Apply the migrations
        run: pnpm --filter @extas/db migrate:deploy
      - name: Schema matches the migrations (no drift)
        run: |
          cd packages/db
          node scripts/prisma.mjs migrate diff --from-url "$DATABASE_DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Vault against PostgreSQL (PR 493)
        env:
          EXTAS_TEST_DATABASE_URL: ${{ env.DATABASE_DIRECT_URL }}
        run: pnpm --filter @extas/vault test
      # PR 491, 492, 496, 510 — resolver precedence, validation, reset to default and the settings migration, on a real
      # PostgreSQL (each test file creates and drops its own throwaway database).
      - name: Settings tests on PostgreSQL
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/settings test
      # PR 18 — the adapter framework on PostgreSQL, and the storage contract against Azurite (Azure Blob) and an
      # S3-compatible test server (rclone serve s3). Azurite's account key is its public, documented development key.
      - name: Adapters and storage (PR 18)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
          AZURITE_BLOB_URL: http://127.0.0.1:10000/devstoreaccount1
          AZURITE_ACCOUNT: devstoreaccount1
          AZURITE_ACCOUNT_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
          S3_TEST_ENDPOINT: http://127.0.0.1:8333
          S3_TEST_ACCESS_KEY: ci-only-access
          S3_TEST_SECRET_KEY: ci-only-secret
        run: |
          docker run -d -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          mkdir -p /tmp/s3data/extas-test
          docker run -d -p 127.0.0.1:8333:8333 -v /tmp/s3data:/data rclone/rclone:1.71.1 \
            serve s3 /data --addr :8333 --auth-key "$S3_TEST_ACCESS_KEY,$S3_TEST_SECRET_KEY"
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:10000/ && curl -s -o /dev/null http://127.0.0.1:8333/ && break
            sleep 1
          done
          pnpm --filter @extas/adapters test
      # PR 15, 16, 495 — sign-in, sessions, 2FA, lockout, the permission model and the role builder; then the admin API
      # end to end (login cookie, guard on every route, settings list behind settings.read). Throwaway databases.
      - name: Auth tests on PostgreSQL
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/auth test
      # PR 22, 23, 24, 25, 37 — the image pipeline (5 sizes × AVIF/WebP/JPEG at 4:5, the archived original, the
      # dominant colour), the watermarked download, the photo minimum and the media library (search, reuse, orphans
      # archived only and logged), on the memory and local-disk storage adapters. The media API itself runs with the
      # web tests in the next step (src/lib/media-api.db.test.ts).
      - name: Media library on PostgreSQL (PR 22–25, 37)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/media test
      # S01 · PR 19, 20, 30, 31, 590 — the catalogue: SKU key rules, category tree and garment types, colour library,
      # fabrics, store isolation, audit rows, and naming with 301s without chains; PR 21, 26, 29, 35 — the publish
      # checklist, health score, publish gate and queue, bulk actions and the edit form save. Throwaway databases.
      - name: Catalogue tests on PostgreSQL (PR 19, 20, 21, 26, 29, 30, 31, 35, 590)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/catalogue test
      # S09 · PR 497, 498, 499, 194, 195, 196, 201 — inventory and ERP sync on the practice ERP (no key, no network):
      # the mode switch, the ERP-absent guard, retries and the error surface, the stock pull per SKU, company and
      # warehouse mapping, and locations with the damaged bin. Throwaway databases.
      - name: Inventory tests on PostgreSQL (S09 · PR 497, 498, 499, 194, 195, 196, 201)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/inventory test
      # S10 · PR 208–219 — Smart Rules: drafts and versions, the owner's OK for money, archive instead of delete,
      # conflicts and "Fix everywhere", the simulation over orders, notices and the pop-up rules, coupons with their
      # limits, what the storefront reads, the end-date job and the sample rules. Throwaway databases.
      - name: Smart Rules tests on PostgreSQL (S10 · PR 208–219)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/rules test
      - name: Admin API tests on PostgreSQL (incl. the product admin routes, PR 21, 26, 29, 35)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: |
          pnpm status:gen
          pnpm --filter @extas/web test
      - name: Settings sync, twice (the second run must change nothing)
        run: |
          pnpm --filter @extas/settings sync | tee /tmp/sync-1.txt
          pnpm --filter @extas/settings sync | tee /tmp/sync-2.txt
          grep -q 'settings sync: applied' /tmp/sync-1.txt
          grep -q 'settings sync: unchanged' /tmp/sync-2.txt
      - name: Auth sync, twice (permission catalogue + owner role; the second run must change nothing)
        run: |
          pnpm --filter @extas/auth sync | tee /tmp/auth-1.txt
          pnpm --filter @extas/auth sync | tee /tmp/auth-2.txt
          grep -q 'auth sync: applied' /tmp/auth-1.txt
          grep -q 'auth sync: unchanged' /tmp/auth-2.txt
      # PR 14, 508, 509 — the default pack, the sample seed (run twice inside the tests) and the installation export /
      # import, each test file on its own throwaway database.
      - name: Seed tests on PostgreSQL (PR 14, 508, 509)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/seed test
      - name: Sample seed, twice (the second run must change nothing)
        run: |
          pnpm --filter @extas/seed sample | tee /tmp/sample-1.txt
          pnpm --filter @extas/seed sample | tee /tmp/sample-2.txt
          grep -q 'sample seed: applied' /tmp/sample-1.txt
          grep -q 'sample seed: unchanged' /tmp/sample-2.txt
      # S10 — the sample Smart Rules and notices for the sample store, twice (the second run must create nothing).
      - name: Sample rules, twice (the second run must change nothing)
        run: |
          pnpm --filter @extas/rules sample | tee /tmp/rules-1.txt
          pnpm --filter @extas/rules sample | tee /tmp/rules-2.txt
          grep -q 'rule(s)' /tmp/rules-1.txt
          grep -q ': 0 rule(s), 0 notice(s) created' /tmp/rules-2.txt
      - name: Installation export leaves the owner's data out, and imports back (PR 509)
        run: |
          pnpm --filter @extas/seed export:installation --out /tmp/installation-export.json
          pnpm --filter @extas/seed import:installation --in /tmp/installation-export.json

  # One register PR = one commit (owner's audit, 20 Oct): every commit of a pull request names exactly one PR.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: One register PR per commit
        run: node tools/check-commits.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
