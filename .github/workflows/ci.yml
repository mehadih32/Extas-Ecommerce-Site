# CI on GitHub-hosted runners (PR 17). Heavy jobs move to extas-vm once the app exists.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Machine reports the VM commits back (server-setup, deploy, owner-account) start nothing: no ci, so no deploy
    # (no loop). Their commits also carry [skip ci].
    paths-ignore:
      - "docs/reports/server/**"
      - "docs/reports/smoke/**"

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # A broken workflow file runs nothing at all (and a broken deploy.yml deploys nothing): parse every one of them.
      - name: Workflow files parse
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install -q --user pyyaml
          for f in .github/workflows/*.yml; do python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f" || { echo "::error file=$f::not valid YAML"; exit 1; }; done
      - name: ShellCheck
        run: shellcheck -x -S warning -e SC2034 infra/server/setup.sh infra/server/lib.sh infra/server/steps/*.sh infra/server/bin/* infra/tests/run.sh infra/bootstrap/install-runner.sh
      - name: Infra unit tests (disk detection, NVMe detection, auto profile)
        run: infra/tests/run.sh
      - name: Compose file is valid
        run: |
          infra/server/bin/extas-profile --cpu 8 --mem-kb 65842000 > /tmp/profile.env
          printf 'EXTAS_ROOT=/srv/extas\nEXTAS_NVME_MOUNT=/mnt/nvme\nEXTAS_STAGING_HOST=example.test\nIMG_POSTGRES=postgres:17\nIMG_REDIS=redis:7.4-alpine\nIMG_MEILI=getmeili/meilisearch:v1.15\nIMG_CADDY=caddy:2.10-alpine\nREDIS_PASSWORD=x\nREDIS_CACHE_MAX_MB=1\nREDIS_QUEUE_MAX_MB=1\nMEILI_MASTER_KEY=x\nMEILI_INDEX_MEM_MB=1\n' > /tmp/stack.env
          sudo mkdir -p /srv/extas/config/secrets && sudo touch /srv/extas/config/secrets/postgres.env
          docker compose -f infra/stack/compose.yml --env-file /tmp/profile.env --env-file /tmp/stack.env config -q
      - name: Caddyfile is valid
        run: |
          mkdir -p /tmp/sites && printf 'root * /srv/www\nfile_server\n' > /tmp/sites/upstream.caddy && : > /tmp/sites/noindex.caddy
          # The preview gate exactly as server setup writes it (a throwaway password; PR 7).
          hash="$(docker run --rm caddy:2.10-alpine caddy hash-password --plaintext ci-only)"
          bash infra/stack/caddy/auth-block.sh "# ci" extas "$hash" "$(printf ci | sha256sum | cut -c1-64)" 30 > /tmp/sites/auth.caddy
          docker run --rm -e EXTAS_STAGING_HOST=example.test -v "$PWD/infra/stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/sites:/etc/caddy/sites:ro caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Deploy script and app compose are valid
        run: |
          shellcheck -x -S warning infra/deploy/deploy.sh infra/deploy/images.sh infra/deploy/app-role.sh infra/deploy/deploy-report.sh infra/deploy/docs-sync.sh infra/deploy/smoke.sh tools/admin-login-e2e.sh tools/admin-session-e2e.sh
          EXTAS_CONFIG_FILE=infra/config/server.conf infra/deploy/deploy.sh upstream blue > /tmp/sites/upstream.caddy
          docker run --rm -e EXTAS_STAGING_HOST=example.test -v "$PWD/infra/stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/sites:/etc/caddy/sites:ro caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          # PR 6: the background worker runs in each colour too (from the migrate image); deploy.sh sets these.
          printf 'APP_IMAGE=extas-web:test\nWORKER_IMAGE=extas-migrate:test\nWORKER_REPLICAS=1\nEXTAS_COLOR=blue\nEXTAS_ROOT=/srv/extas\nEXTAS_NVME_MOUNT=/mnt/nvme\nEXTAS_TIMEZONE=Asia/Dhaka\n' > /tmp/app.env
          sudo touch /srv/extas/config/secrets/app.env /srv/extas/config/secrets/app-connections.env
          docker compose -f infra/stack/app.yml --env-file /tmp/profile.env --env-file /tmp/app.env config -q

  # PR 17 — the app: lint, type-check, unit tests, build, the Lighthouse budget (lighthouserc.json, Blueprint V2.1
  # speed targets) and the production image.
  web:
    runs-on: ubuntu-24.04
    # PR 508 — a throwaway PostgreSQL for the admin session end to end (the last step), on this job's own build.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: extas
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: extas
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U extas" --health-interval 2s --health-retries 30
    env:
      # The Prisma client of the full schema (333 models) costs every type-check about 2.5–3 GB of heap; Node's default
      # limit on the runner is about 2 GB.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Image copies every workspace manifest
        run: |
          missing=0
          for f in packages/*/package.json; do
            grep -qF "COPY $f " apps/web/Dockerfile || { echo "apps/web/Dockerfile does not copy $f"; missing=1; }
          done
          exit $missing
      - name: Fonts are self-hosted (the image build must not download fonts)
        run: |
          if grep -rn "next/font/google" apps/web/src; then echo "use the self-hosted fonts in apps/web/src/fonts"; exit 1; fi
      - name: Hardcode guard (PR 494)
        run: node tools/hardcode-guard.mjs
      # PR 509 — no default, default-pack value or sample value is the owner's own data; the register matches the schema
      # and the installation export can never read a register table or column.
      - name: Owner-data register check (PR 509)
        run: pnpm --filter @extas/seed owner-data:check
      - name: Status data from the register
        run: pnpm status:gen
      # README's "Stages" row must agree with the register's "**Progress: …**" line on every PR and merge.
      - name: README status matches the register
        run: node tools/readme-status.mjs
      # Stage and PR pages (docs/stages) and the README's stage/PR links are generated from the register: they must be
      # current on every PR and merge.
      - name: Stage pages match the register
        run: |
          node tools/docs/gen-stage-pages.mjs --check || { echo "::error::docs/stages or the README links are out of date: run pnpm docs:stages and commit the result"; exit 1; }
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @extas/web build
      - name: Lighthouse budget
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
          npx -y @lhci/cli@0.15.1 autorun
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
      # PR 85 — the device gate (next job) reuses this build: the standalone server with its static files, packed as
      # one tar (pnpm's standalone output has symlinks, which an artifact upload would lose).
      - name: Pack the build for the device gate
        run: |
          cp -r apps/web/public apps/web/.next/standalone/apps/web/ 2>/dev/null || true
          tar -czf /tmp/web-standalone.tgz -C apps/web/.next standalone
      - name: Keep the build for the device gate
        uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: /tmp/web-standalone.tgz
          retention-days: 1
      - name: Production image builds
        run: docker build -f apps/web/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t extas-web:ci .
      - name: Migrate image builds (deploy step 0 — schema migrations + settings sync)
        run: docker build -f apps/web/Dockerfile --target migrate --build-arg GIT_SHA="$GITHUB_SHA" -t extas-migrate:ci .
      # PR 4 (owner, 20 Oct): log in → the admin loads, on these two images and a fresh installation (the migrate
      # image's own command, the first owner with a generated password, a real browser). deploy.yml only runs after
      # CI passed, so no deploy goes out without it. Playwright stays outside the workspace (no lockfile change).
      - name: Sign-in end to end (log in → the admin loads)
        env:
          NODE_PATH: ${{ runner.temp }}/e2e/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/e2e" --no-save --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/e2e/node_modules/.bin/playwright" install --with-deps chromium
          bash tools/admin-login-e2e.sh extas-web:ci extas-migrate:ci
      # PR 508 (PROGRESS follow-up 19) — the admin session end to end on this job's build: a fresh installation on a
      # throwaway database (the migrate image's own command, read from the Dockerfile), a test-only admin with a first
      # password generated at run time, then a real browser signs in, refreshes, opens the sign-in page while signed in
      # (it must go to the admin), logs out, and finds the admin closed again, also for the old session cookie. Any
      # console error or failed request on the way fails it. Reuses the Playwright of the step above.
      - name: Admin session end to end (sign in, refresh, sign-in page while signed in, log out)
        env:
          NODE_PATH: ${{ runner.temp }}/e2e/node_modules
          E2E_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: bash tools/admin-session-e2e.sh

  # PR 85 — the device gate (Blueprint Appendix C1/C2, D1.4): every lighthouserc URL on the 15 phones, 10 tablet sizes
  # and 6 desktop widths, with the demo gate's layout checks (docs/qa/device-matrix.js) plus tap targets (44 × 44),
  # 16 px form fields on touch screens and nothing cut off at either edge. 0 fails or the job fails. One Chromium,
  # several pages at once; the report (Markdown, JSON, screenshots of failures) is kept as an artifact.
  # Follow-up 5: signed in, on a throwaway database holding the sample catalogue (sample data only, never the owner's),
  # so the admin controls that only show with data (colour chips, their remove buttons, the photo-kind picker, the
  # size-chart list, the stock rows) are measured as well (docs/qa/device-gate.json `signedIn`).
  device-gate:
    needs: web
    runs-on: ubuntu-24.04
    # The seeded Lighthouse list and the gate's pages grow with every storefront batch (PR 75 added the help pages and
    # the wishlist: Lighthouse alone took 15 minutes, the Playwright install 9), so 30 minutes cut the gate off mid-run.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: extas
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: extas
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U extas" --health-interval 2s --health-retries 30
    env:
      PLAYWRIGHT_VERSION: 1.63.0
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
      DATABASE_DIRECT_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # What a deploy's migrate step runs, then the sample data (the sample store becomes the mother store on this empty
      # database) and a throwaway owner with a generated first password; the gate changes it at its first sign-in.
      - name: Sample database and the gate's owner
        run: |
          pnpm --filter @extas/db migrate:deploy
          pnpm --filter @extas/settings sync
          pnpm --filter @extas/auth sync
          pnpm --filter @extas/delivery gazetteer:import --deploy
          pnpm --filter @extas/seed sample
          pnpm --filter @extas/rules sample
          pnpm --filter @extas/combos sample
          pnpm --filter @extas/auth create-owner --email gate@example.test --name "Device gate" --generate-to "$RUNNER_TEMP/gate-password"
      # PR 139 (CN-022): the app runs as its own role, as on the server (infra/deploy/app-role.sh): migration 0010 made
      # extas_app without a login; this throwaway database gives it one. Every page the gate opens, and the sign-in
      # with its audit rows, then runs without UPDATE, DELETE or TRUNCATE on the history tables.
      - name: The app's own database role (extas_app)
        run: psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -qc "ALTER ROLE extas_app LOGIN PASSWORD 'ci-only-app'"
      - name: The web build from the web job
        uses: actions/download-artifact@v4
        with:
          name: web-standalone
          path: /tmp
      - name: Unpack it
        run: mkdir -p apps/web/.next && tar -xzf /tmp/web-standalone.tgz -C apps/web/.next
      # Playwright stays outside the workspace (no lockfile change); the gate finds it through NODE_PATH.
      - name: Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium
      # PR 107: EXTAS_SHOP_TEST_PAGES=1 opens the sample-bag fill the gate uses for the filled bag (device-gate.json
      # `filled`). HOSTNAME=0.0.0.0 as in the Dockerfile: bound to 127.0.0.1, the /bn rewrite became a full URL on
      # "localhost", the proxy ran twice and every /bn page was measured in English.
      - name: Start the app (standalone server, on the sample database; throwaway keys)
        run: |
          rand() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          DATABASE_URL=postgresql://extas_app:ci-only-app@127.0.0.1:5432/extas \
          SESSION_SECRET="$(rand)$(rand)" VAULT_MASTER_KEY="$(rand)$(rand)" PORT=3000 HOSTNAME=0.0.0.0 EXTAS_SHOP_TEST_PAGES=1 \
            nohup node apps/web/.next/standalone/apps/web/server.js > /tmp/web-server.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:3000/status && exit 0; sleep 1; done
          cat /tmp/web-server.log; exit 1
      # Follow-up 23 (PR 82): the storefront's Lighthouse budget on the sample data too (the web job's run has no
      # database, so its pages carry no products). Before the gate, which signs in and changes the owner's password.
      - name: Lighthouse budget on the sample data
        run: npx -y @lhci/cli@0.15.1 autorun --config=lighthouserc.seeded.json
      - name: Keep the sample-data Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-seeded
          path: .lighthouseci-seeded
          include-hidden-files: true
          retention-days: 7
      # PR 88: the page and image weight targets (docs/qa/page-weight.json) on the same runs, all three of each page.
      - name: Page and image weight on the sample data
        run: node tools/page-weight.mjs .lighthouseci
      - name: Device gate, signed in on the sample data (0 fails)
        env:
          NODE_PATH: ${{ runner.temp }}/qa/node_modules
        run: |
          node tools/device-gate.mjs --base=http://127.0.0.1:3000 --out=device-gate-report \
            --email=gate@example.test --password-file="$RUNNER_TEMP/gate-password"
      - name: Device gate summary
        if: always()
        run: cat device-gate-report/device-gate.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # A failed page (an HTTP 500, say) is only explained by the server's own log, so it is printed and kept.
      - name: Server log when the gate fails
        if: failure()
        run: |
          tail -n 300 /tmp/web-server.log || true
          cp /tmp/web-server.log device-gate-report/web-server.log 2>/dev/null || true
      - name: Keep the device gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-gate
          path: device-gate-report
          retention-days: 7

  # PR 13 / 603 — the schema's migrations apply to a real PostgreSQL 17 with pg_trgm (throwaway CI database); then the
  # settings framework's database tests (PR 491–496, 510) and the seed package's (PR 14, 508, 509).
  db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: extas
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: extas
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U extas" --health-interval 2s --health-retries 30
      # PR 6 — the worker's queue store for its tests (the server's is set up the same: no eviction).
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
      DATABASE_DIRECT_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Apply the migrations
        run: pnpm --filter @extas/db migrate:deploy
      - name: Schema matches the migrations (no drift)
        run: |
          cd packages/db
          node scripts/prisma.mjs migrate diff --from-url "$DATABASE_DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      # PR 13, 603, 139 — the migration shape checks, all migrations on a throwaway database without drift, and the
      # append-only guards (CN-022): as the app's role (extas_app) the audit log and the history tables take INSERT
      # and SELECT, never UPDATE, DELETE or TRUNCATE; as the owner the trigger refuses them too.
      - name: Database package on PostgreSQL (PR 13, 603, 139)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/db test
      - name: Vault against PostgreSQL (PR 493)
        env:
          EXTAS_TEST_DATABASE_URL: ${{ env.DATABASE_DIRECT_URL }}
        run: pnpm --filter @extas/vault test
      # PR 491, 492, 496, 510 — resolver precedence, validation, reset to default and the settings migration, on a real
      # PostgreSQL (each test file creates and drops its own throwaway database).
      - name: Settings tests on PostgreSQL
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/settings test
      # PR 18 — the adapter framework on PostgreSQL, and the storage contract against Azurite (Azure Blob) and an
      # S3-compatible test server (rclone serve s3). Azurite's account key is its public, documented development key.
      - name: Adapters and storage (PR 18)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
          AZURITE_BLOB_URL: http://127.0.0.1:10000/devstoreaccount1
          AZURITE_ACCOUNT: devstoreaccount1
          AZURITE_ACCOUNT_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
          S3_TEST_ENDPOINT: http://127.0.0.1:8333
          S3_TEST_ACCESS_KEY: ci-only-access
          S3_TEST_SECRET_KEY: ci-only-secret
        run: |
          docker run -d -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          mkdir -p /tmp/s3data/extas-test
          docker run -d -p 127.0.0.1:8333:8333 -v /tmp/s3data:/data rclone/rclone:1.71.1 \
            serve s3 /data --addr :8333 --auth-key "$S3_TEST_ACCESS_KEY,$S3_TEST_SECRET_KEY"
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:10000/ && curl -s -o /dev/null http://127.0.0.1:8333/ && break
            sleep 1
          done
          pnpm --filter @extas/adapters test
      # PR 15, 16, 495 — sign-in, sessions, 2FA, lockout, the permission model and the role builder; then the admin API
      # end to end (login cookie, guard on every route, settings list behind settings.read). Throwaway databases.
      - name: Auth tests on PostgreSQL
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/auth test
      # PR 22, 23, 24, 25, 37 — the image pipeline (5 sizes × AVIF/WebP/JPEG at 4:5, the archived original, the
      # dominant colour), the watermarked download, the photo minimum and the media library (search, reuse, orphans
      # archived only and logged), on the memory and local-disk storage adapters. The media API itself runs with the
      # web tests in the next step (src/lib/media-api.db.test.ts).
      - name: Media library on PostgreSQL (PR 22–25, 37)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/media test
      # S01 · PR 19, 20, 30, 31, 590 — the catalogue: SKU key rules, category tree and garment types, colour library,
      # fabrics, store isolation, audit rows, and naming with 301s without chains; PR 21, 26, 29, 35 — the publish
      # checklist, health score, publish gate and queue, bulk actions and the edit form save. Throwaway databases.
      - name: Catalogue tests on PostgreSQL (PR 19, 20, 21, 26, 29, 30, 31, 35, 590)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/catalogue test
      # S09 · PR 497, 498, 499, 194, 195, 196, 201 — inventory and ERP sync on the practice ERP (no key, no network):
      # the mode switch, the ERP-absent guard, retries and the error surface, the stock pull per SKU, company and
      # warehouse mapping, and locations with the damaged bin. PR 196: the ERP webhooks (no secret → refused; unsigned,
      # wrong and stale refused; stored once; out-of-order changes ignored; the poll afterwards adds nothing). Throwaway
      # databases.
      - name: Inventory tests on PostgreSQL (S09 · PR 497, 498, 499, 194, 195, 196, 201)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/inventory test
      # S10 · PR 208–219 — Smart Rules: drafts and versions, the owner's OK for money, archive instead of delete,
      # conflicts and "Fix everywhere", the simulation over orders, notices and the pop-up rules, coupons with their
      # limits, what the storefront reads, the end-date job and the sample rules. Throwaway databases.
      - name: Smart Rules tests on PostgreSQL (S10 · PR 208–219)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/rules test
      - name: Combo tests on PostgreSQL (S03 · PR 89–104, 571, 575)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/combos test
      - name: Bag tests on PostgreSQL (S04 · PR 105–114)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/cart test
      # S04 · PR 115–126 — the checkout: the quote (delivery charge from the resolved place, payment, prepaid reward,
      # wallet), order placement with its idempotency key, the shown charge = the stored one (SIM-F-003), the captured
      # incomplete checkouts and failed payments (SIM-F-026), and the thank-you receipt. Throwaway databases.
      - name: Checkout tests on PostgreSQL (S04 · PR 115–126)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/checkout test
      # S04 · PR 129–137 — customer accounts: the account made with the first order and never a guessable password
      # (SIM-F-039), sign-in by a one-time SMS code (on the mock SMS sender) with its rate limits, the code on a new
      # device, the browser's wishlist joining the account, My account, the offer banner from real balances and offers
      # only, the order page with its tracking steps as stored and the late flag (SIM-F-018). Throwaway databases.
      - name: Customer accounts on PostgreSQL (S04 · PR 129–137)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/accounts test
      # PR 6 (CN-022) — the background worker: a JobRun row per attempt, retries with the backoff and the dead letter,
      # the run-level idempotency (a delivery of a finished run is skipped), one scheduler leader, the heartbeat and the
      # Server page's read model; a worker killed in the middle of a real stock pull on the practice ERP is taken over
      # by another with no second stock movement; a stored ERP webhook (PR 196) planned by the leader and applied once.
      # BullMQ on the job's Redis (its own key prefix).
      - name: Background worker on PostgreSQL and Redis (PR 6)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pnpm --filter @extas/jobs test
      # S05 · PR 155 (CN-022) — the one KPI definition: Sales = delivered orders only (delivered day), Ordered value =
      # every placed order (placed day), by day, zone and payment method, on sample orders in every state (PLACED never
      # in Sales); and the guard that no view adds up order money on its own. Throwaway database.
      - name: Metrics on PostgreSQL (S05 · PR 155)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/metrics test
      # S02 · PR 72 — storefront search: what it can find (published products of shown categories, shown categories),
      # the PostgreSQL matcher (prefix, slips, phrases, other words, Bengali, general words), the adapter's choice
      # (Meilisearch only while its index is current; slow or down → PostgreSQL) and the indexer (one version once),
      # against an in-memory stand-in for Meilisearch's HTTP API. Throwaway database.
      - name: Search on PostgreSQL (S02 · PR 72)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/search test
      # S06 · PR 549–553, 555 — the delivery-zone engine: the gazetteer importer (re-runs change nothing, nothing is
      # deleted), the band map, the resolver, the autocomplete, the charge accuracy suite and phone-first recognition.
      - name: Delivery-zone engine on PostgreSQL (S06 · PR 549–553, 555)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/delivery test
      - name: Sample gazetteer as the deploy imports it, twice (the second run must change nothing)
        run: |
          pnpm --filter @extas/delivery gazetteer:import --deploy | tee /tmp/geo-1.txt
          pnpm --filter @extas/delivery gazetteer:import --deploy | tee /tmp/geo-2.txt
          grep -q 'gazetteer import: applied' /tmp/geo-1.txt
          grep -q 'gazetteer import: unchanged' /tmp/geo-2.txt
      - name: Admin API tests on PostgreSQL (incl. the product admin routes, PR 21, 26, 29, 35)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: |
          pnpm status:gen
          pnpm --filter @extas/web test
      - name: Settings sync, twice (the second run must change nothing)
        run: |
          pnpm --filter @extas/settings sync | tee /tmp/sync-1.txt
          pnpm --filter @extas/settings sync | tee /tmp/sync-2.txt
          grep -q 'settings sync: applied' /tmp/sync-1.txt
          grep -q 'settings sync: unchanged' /tmp/sync-2.txt
      - name: Auth sync, twice (permission catalogue + owner role; the second run must change nothing)
        run: |
          pnpm --filter @extas/auth sync | tee /tmp/auth-1.txt
          pnpm --filter @extas/auth sync | tee /tmp/auth-2.txt
          grep -q 'auth sync: applied' /tmp/auth-1.txt
          grep -q 'auth sync: unchanged' /tmp/auth-2.txt
      # PR 14, 508, 509 — the default pack, the sample seed (run twice inside the tests) and the installation export /
      # import, each test file on its own throwaway database.
      - name: Seed tests on PostgreSQL (PR 14, 508, 509)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/seed test
      - name: Sample seed, twice (the second run must change nothing)
        run: |
          pnpm --filter @extas/seed sample | tee /tmp/sample-1.txt
          pnpm --filter @extas/seed sample | tee /tmp/sample-2.txt
          grep -q 'sample seed: applied' /tmp/sample-1.txt
          grep -q 'sample seed: unchanged' /tmp/sample-2.txt
      # S10 — the sample Smart Rules and notices for the sample store, twice (the second run must create nothing).
      - name: Sample rules, twice (the second run must change nothing)
        run: |
          pnpm --filter @extas/rules sample | tee /tmp/rules-1.txt
          pnpm --filter @extas/rules sample | tee /tmp/rules-2.txt
          grep -q 'rule(s)' /tmp/rules-1.txt
          grep -q ': 0 rule(s), 0 notice(s) created' /tmp/rules-2.txt
      - name: Installation export leaves the owner's data out, and imports back (PR 509)
        run: |
          pnpm --filter @extas/seed export:installation --out /tmp/installation-export.json
          pnpm --filter @extas/seed import:installation --in /tmp/installation-export.json

  # One register PR = one commit (owner's audit, 20 Oct): every commit of a pull request names exactly one PR.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: One register PR per commit
        run: node tools/check-commits.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # readme-guard (owner, 20 Oct, CN-011; PR 594): README.md must be current in every pull request into main — a PR log
  # row for every PR in the title, stage counts equal to the register's statuses, no touched stage "Not started".
  readme-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      # Its tests (tools/readme-guard.test.mjs) run with the web tests, like the other tools/ tests.
      - uses: actions/checkout@v4
      - name: README is up to date for this PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/readme-guard.mjs
