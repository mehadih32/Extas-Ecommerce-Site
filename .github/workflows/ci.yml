# CI on GitHub-hosted runners (PR 17). Heavy jobs move to extas-vm once the app exists.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -S warning -e SC2034 infra/server/setup.sh infra/server/lib.sh infra/server/steps/*.sh infra/server/bin/* infra/tests/run.sh infra/bootstrap/install-runner.sh
      - name: Infra unit tests (disk detection, NVMe detection, auto profile)
        run: infra/tests/run.sh
      - name: Compose file is valid
        run: |
          infra/server/bin/extas-profile --cpu 8 --mem-kb 65842000 > /tmp/profile.env
          printf 'EXTAS_ROOT=/srv/extas\nEXTAS_NVME_MOUNT=/mnt/nvme\nEXTAS_STAGING_HOST=example.test\nIMG_POSTGRES=postgres:17\nIMG_REDIS=redis:7.4-alpine\nIMG_MEILI=getmeili/meilisearch:v1.15\nIMG_CADDY=caddy:2.10-alpine\nREDIS_PASSWORD=x\nREDIS_CACHE_MAX_MB=1\nREDIS_QUEUE_MAX_MB=1\nMEILI_MASTER_KEY=x\nMEILI_INDEX_MEM_MB=1\n' > /tmp/stack.env
          sudo mkdir -p /srv/extas/config/secrets && sudo touch /srv/extas/config/secrets/postgres.env
          docker compose -f infra/stack/compose.yml --env-file /tmp/profile.env --env-file /tmp/stack.env config -q
      - name: Caddyfile is valid
        run: |
          mkdir -p /tmp/sites && printf 'root * /srv/www\nfile_server\n' > /tmp/sites/upstream.caddy && : > /tmp/sites/auth.caddy && : > /tmp/sites/noindex.caddy
          docker run --rm -e EXTAS_STAGING_HOST=example.test -v "$PWD/infra/stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/sites:/etc/caddy/sites:ro caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Deploy script and app compose are valid
        run: |
          shellcheck -x -S warning infra/deploy/deploy.sh
          EXTAS_CONFIG_FILE=infra/config/server.conf infra/deploy/deploy.sh upstream blue > /tmp/sites/upstream.caddy
          docker run --rm -e EXTAS_STAGING_HOST=example.test -v "$PWD/infra/stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/sites:/etc/caddy/sites:ro caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          printf 'APP_IMAGE=extas-web:test\nEXTAS_COLOR=blue\nEXTAS_ROOT=/srv/extas\nEXTAS_NVME_MOUNT=/mnt/nvme\nEXTAS_TIMEZONE=Asia/Dhaka\n' > /tmp/app.env
          sudo touch /srv/extas/config/secrets/app.env /srv/extas/config/secrets/app-connections.env
          docker compose -f infra/stack/app.yml --env-file /tmp/profile.env --env-file /tmp/app.env config -q

  # PR 17 — the app: lint, type-check, unit tests, build, the Lighthouse budget (lighthouserc.json, Blueprint V2.1
  # speed targets) and the production image.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Hardcode guard (PR 494)
        run: node tools/hardcode-guard.mjs
      - name: Status data from the register
        run: pnpm status:gen
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @extas/web build
      - name: Lighthouse budget
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
          npx -y @lhci/cli@0.15.1 autorun
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
      - name: Production image builds
        run: docker build -f apps/web/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t extas-web:ci .
      - name: Migrate image builds (deploy step 0 — schema migrations + settings sync)
        run: docker build -f apps/web/Dockerfile --target migrate --build-arg GIT_SHA="$GITHUB_SHA" -t extas-migrate:ci .

  # PR 13 / 603 — the schema's migrations apply to a real PostgreSQL 17 with pg_trgm (throwaway CI database); then the
  # settings framework's database tests (PR 491–496, 510).
  db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: extas
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: extas
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U extas" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
      DATABASE_DIRECT_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Apply the migrations
        run: pnpm --filter @extas/db migrate:deploy
      - name: Schema matches the migrations (no drift)
        run: |
          cd packages/db
          node scripts/prisma.mjs migrate diff --from-url "$DATABASE_DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Vault against PostgreSQL (PR 493)
        env:
          EXTAS_TEST_DATABASE_URL: ${{ env.DATABASE_DIRECT_URL }}
        run: pnpm --filter @extas/vault test
      # PR 491, 492, 496, 510 — resolver precedence, validation, reset to default and the settings migration, on a real
      # PostgreSQL (each test file creates and drops its own throwaway database).
      - name: Settings tests on PostgreSQL
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
        run: pnpm --filter @extas/settings test
      # PR 18 — the adapter framework on PostgreSQL, and the storage contract against Azurite (Azure Blob) and an
      # S3-compatible test server (rclone serve s3). Azurite's account key is its public, documented development key.
      - name: Adapters and storage (PR 18)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://extas:ci-only@127.0.0.1:5432/extas
          AZURITE_BLOB_URL: http://127.0.0.1:10000/devstoreaccount1
          AZURITE_ACCOUNT: devstoreaccount1
          AZURITE_ACCOUNT_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
          S3_TEST_ENDPOINT: http://127.0.0.1:8333
          S3_TEST_ACCESS_KEY: ci-only-access
          S3_TEST_SECRET_KEY: ci-only-secret
        run: |
          docker run -d -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          mkdir -p /tmp/s3data/extas-test
          docker run -d -p 127.0.0.1:8333:8333 -v /tmp/s3data:/data rclone/rclone:1.71.1 \
            serve s3 /data --addr :8333 --auth-key "$S3_TEST_ACCESS_KEY,$S3_TEST_SECRET_KEY"
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:10000/ && curl -s -o /dev/null http://127.0.0.1:8333/ && break
            sleep 1
          done
          pnpm --filter @extas/adapters test
      - name: Settings sync, twice (the second run must change nothing)
        run: |
          pnpm --filter @extas/settings sync | tee /tmp/sync-1.txt
          pnpm --filter @extas/settings sync | tee /tmp/sync-2.txt
          grep -q 'settings sync: applied' /tmp/sync-1.txt
          grep -q 'settings sync: unchanged' /tmp/sync-2.txt
