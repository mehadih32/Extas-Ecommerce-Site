# S21 · PR 570 (B7.3, Note 14/21) — the checklist audit against the preview host, ON the VM through the self-hosted
# runner (CN-003). Every hour the server checks whether an audit is due: the owner's schedule (AI › Checklist audit:
# daily or weekly, off as it ships) or a "Run now" press there (infra/deploy/audit.sh, audit-lib.sh). An audit runs the
# smoke test and the saved journeys with every UI check, then reports per checklist group (tools/audit-report.mjs).
# The result shows on AI › Checklist audit and the Site health hub (state/audit.json); with the owner's switch on, the
# report goes to his Telegram. Nothing is committed and nothing is fixed here. By hand: "now" runs at once.
name: audit

on:
  schedule:
    - cron: "35 * * * *"   # every hour; the server decides whether an audit is due
  workflow_dispatch:
    inputs:
      mode:
        description: "due (follow the schedule) or now (run at once)"
        required: false
        default: "now"

# Its own group (as journeys.yml): a queued hourly check never replaces a deploy or server job.
concurrency:
  group: extas-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, extas-vm]
    timeout-minutes: 60
    steps:
      # The audit comes from the version that is live, not from the newest main (as in journeys.yml).
      - name: Find the live version
        id: live
        run: |
          live="$(sudo jq -r '.sha // ""' /srv/extas/state/last-good-deploy.json 2>/dev/null || true)"
          if printf '%s' "$live" | grep -Eq '^[0-9a-f]{40}$'; then echo "sha=$live" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.live.outputs.sha || github.sha }}

      - name: Checklist audit (when due)
        env:
          LIVE: ${{ steps.live.outputs.sha }}
          ASKED: ${{ github.event.inputs.mode }}
        run: |
          live="$LIVE"
          MODE="due"; [ "$ASKED" = "now" ] && MODE="now"
          sudo env EXTAS_CONFIG_FILE="$PWD/infra/config/server.conf" bash infra/deploy/audit.sh "$RUNNER_TEMP/audit" "$MODE" "$live"
