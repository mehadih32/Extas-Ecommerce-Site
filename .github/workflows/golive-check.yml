# S19 · PR 587 (CN-035 step 4c) — the go-live check before the owner's "go live", ON the VM through the self-hosted
# runner (CN-003), BY HAND ONLY: GitHub › Actions › golive-check › Run workflow. Read-only (infra/deploy/golive-check.sh):
# the go-live list of Settings → System → Go-live (Needed before / Soon after, keys and counts only), the WordPress
# redirect map and the sitemap, read on the staging host as the read-only check account; and a dry run of the domain
# switch (the main domain's Caddy block OPEN, validated in a copy inside the Caddy container). It changes no setting, no
# sign-off, no server file, and never asks the main domain. The switch itself is tools/golive-switch.mjs, on the owner's
# own "go live" only (docs/golive/RUNBOOK.md). The report is committed to docs/reports/golive/latest/ with [skip ci].
name: golive-check

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "The main domain the owner will switch (for the dry run only; nothing is applied)"
        required: false
        default: ""

# Its own lane: a by-hand run never replaces a deploy or another server job. The VM's single runner takes one job at a time.
concurrency:
  group: extas-golive-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  golive-check:
    runs-on: [self-hosted, extas-vm]
    timeout-minutes: 45
    steps:
      # The check comes from the version that is live (as in journeys.yml), so its words and paths are the live ones.
      - name: Find the live version
        id: live
        run: |
          live="$(sudo jq -r '.sha // ""' /srv/extas/state/last-good-deploy.json 2>/dev/null || true)"
          if printf '%s' "$live" | grep -Eq '^[0-9a-f]{40}$'; then echo "sha=$live" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.live.outputs.sha || github.sha }}

      # A live version from before this workflow has no golive-check.sh: it comes from this run's own commit.
      - name: The check from this commit when the live version has none
        run: |
          [ -f infra/deploy/golive-check.sh ] && [ -f tools/golive-check.mjs ] && exit 0
          git fetch -q origin "$GITHUB_SHA"
          git checkout -q "$GITHUB_SHA" -- infra/deploy/golive-check.sh tools/golive-check.mjs

      - name: Go-live list, redirects, sitemap, domain switch dry run (read-only)
        id: check
        continue-on-error: true
        env:
          LIVE: ${{ steps.live.outputs.sha }}
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          sudo env EXTAS_CONFIG_FILE="$PWD/infra/config/server.conf" bash infra/deploy/golive-check.sh "$RUNNER_TEMP/golive" "$DOMAIN" "$LIVE"

      - name: Commit the report
        if: always()
        env:
          RESULT: ${{ steps.check.outcome }}
        run: |
          set -eu
          out="$RUNNER_TEMP/golive"
          [ -f "$out/README.md" ] || { echo "the check wrote no report"; exit 1; }
          dest="docs/reports/golive/latest"
          sudo chown -R "$(id -u):$(id -g)" "$out"
          git config user.name "extas-vm"
          git config user.email "extas-vm@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf "$dest" && mkdir -p "$dest"
            cp "$out/README.md" "$out/result.json" "$dest/"
            git add -A "$dest"
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "golive-check report: ${RESULT} [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 2))
          done
          exit 1

      - name: Fail when the check could not run
        if: steps.check.outcome == 'failure'
        run: |
          echo "The go-live check could not finish. See docs/reports/golive/latest/README.md."
          exit 1
