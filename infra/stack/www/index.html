<!doctype html>
<html lang="bn">

<title>EXTAS — তৈরি হচ্ছে</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Noto Sans Bengali", sans-serif; background: #f6f5f2; color: #1b1b1b; }
  @media (prefers-color-scheme: dark) { body { background: #151515; color: #eee; } }
  main { padding: 24px 16px; max-width: 32rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { line-height: 1.6; margin: .25rem 0; }
</style>
</head>
<body>
<main>
  <h1>সার্ভার প্রস্তুত</h1>
  <p>সাইটের কাজ চলছে। প্রথম ডিপ্লয় হলে এখানে অগ্রগতির পাতা দেখা যাবে।</p>
</main>
</body>
</html>
