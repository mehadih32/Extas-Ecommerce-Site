# EXTAS server configuration — the ONE config file for the server (PR 604, A2.9.5, A2.9.15).
# Shell-sourceable KEY=VALUE. No secrets here, ever: secrets are generated on the server
# (/srv/extas/config/secrets, mode 600) or typed into the admin vault by the owner (PR 493).
# Changing a value here and pushing to main re-runs server-setup.yml, which is idempotent.

# --- Where the build is served (CN-003). The domain is a setting, never code. ---
EXTAS_STAGING_HOST="new.extas.com.bd"
EXTAS_EXTRA_HOSTS=""                # PR 362: more host names this server answers on, separated by spaces (the main domain
                                    # on go-live day, PR 587; a store's own domain, S17). Each gets its own automatic
                                    # certificate; until go-live they share the preview password and noindex. Only after
                                    # the go-live switch (search engines let in, PR 401) add the main domain to Keys &
                                    # connections → Cloudflare: before it the main domain is the old shop, and "Send to
                                    # Cloudflare" refuses it.
EXTAS_STAGING_USER="extas"          # login name for the preview password; the password is generated on the server
EXTAS_NOINDEX="yes"                 # staging is never indexed
EXTAS_PREVIEW_COOKIE_DAYS=30        # after the preview login the browser keeps a cookie this long and is not asked again

# --- Machine basics (PR 3) ---
EXTAS_TIMEZONE="Asia/Dhaka"
EXTAS_HOSTNAME="extas-vm"
EXTAS_AUTO_REBOOT="yes"             # unattended security updates may reboot when a kernel needs it
EXTAS_AUTO_REBOOT_TIME="04:30"      # local time (EXTAS_TIMEZONE)
EXTAS_UFW_CLOUDFLARE_ONLY="no"      # yes = 80/443 accept Cloudflare IP ranges only (A2.9.14, optional)

# --- Paths (A2.9.3) ---
EXTAS_ROOT="/srv/extas"             # data disk (LVM) — permanent
EXTAS_NVME_MOUNT="/mnt/nvme"        # local NVMe — temporary, raw after every stop (PR 601)
EXTAS_VG="extas"                    # LVM volume group on the 1 TB data disk

# --- Data-disk volumes in GiB (PR 1, 3). Free space stays in the VG for growth. ---
LV_POSTGRES_GB=250
LV_DOCKER_GB=200
LV_REDIS_GB=20
LV_SEARCH_GB=30
LV_MEDIA_GB=100                      # local storage adapter fallback only; media normally lives on Azure Blob
LV_BACKUP_GB=150
LV_LOGS_GB=30
LV_BASE_GB=10                       # /srv/extas itself: config, secrets, certificates, state, reports, the stack
LV_SWAP_GB=16
EXTAS_DISK_ALARM_PCT=80             # alert when any volume passes this (PR 9)

# --- The OS disk / stays small (PR 4 follow-up, 31 Oct: / reached 97% and the runner died mid-build). Docker 29 keeps
# its images and the build cache in containerd's store, so that store gets its own volume on the data disk
# (steps/13-osdisk.sh), and nothing that grows lives on / without a limit. ---
LV_CONTAINERD_GB=120                # containerd's store (images + build cache); the VG keeps the rest for growth
CONTAINERD_ROOT="/var/lib/containerd"   # containerd's own default root; change only together with /etc/containerd/config.toml
DOCKER_BUILD_CACHE_KEEP_GB=40       # BuildKit keeps at most this much build cache (daemon GC + the clean-up after each deploy)
DEPLOY_KEEP_WEB_IMAGES=5            # app images kept after a deploy (the live one and the rollback target's always stay)
DEPLOY_KEEP_MIGRATE_IMAGES=3        # migrate/worker images kept after a deploy (same rule)
DISK_ROOT_MIN_FREE_GB=15            # a deploy stops before the build when / has less free space than this after the clean-up
JOURNAL_MAX_USE_MB=1024             # the system journal never takes more than this on /
RUNNER_DIR="/home/ghrunner/actions-runner"   # the GitHub runner's folder (infra/bootstrap/install-runner.sh)
RUNNER_DIAG_KEEP_DAYS=7             # the runner's own logs (_diag) are kept this many days
DISK_SNAPSHOT_PCT=60                # when / passes this, the monitor writes what fills it (biggest folders, big files, deleted files still held open) to logs/disk-snapshots, at most every MONITOR_REPEAT_MIN
DISK_SNAPSHOT_KEEP=20               # disk snapshots kept
STORE_ASIDE_KEEP_DAYS=2             # a broken image store set aside by the image check (PR 4) is removed after these days
TMP_KEEP_DAYS=10                    # files in /tmp and /var/tmp untouched this many days are removed (systemd-tmpfiles), so a crashed job's leftovers never pile up

# --- Hardware-aware profile (PR 604). Reference split for 8 vCPU / 64 GB (A2.9.5).
# On another machine every value is scaled from these by detected CPU and RAM; nothing is edited by hand. ---
PROFILE_REF_CPU=8
PROFILE_REF_RAM_GB=64
PROFILE_PG_RAM_GB=16;      PROFILE_PG_CPU=3
PROFILE_REDIS_RAM_GB=6;    PROFILE_REDIS_CPU=1      # split: cache (LRU) 4 GB + queue (no eviction) 2 GB
PROFILE_REDIS_QUEUE_SHARE_PCT=33.34
PROFILE_MEILI_RAM_GB=4;    PROFILE_MEILI_CPU=1
PROFILE_APP_RAM_GB=16;     PROFILE_APP_CPU=6;  PROFILE_APP_REPLICAS=6
PROFILE_APP_HEAP_PCT=75                             # Node heap per replica, % of its memory limit (rest: buffers, sharp)
PROFILE_WORKER_RAM_GB=6;   PROFILE_WORKER_CPU=2     # image / video worker, separate process
PROFILE_JOBS_RAM_GB=4;     PROFILE_JOBS_CPU=1;  PROFILE_JOBS_REPLICAS=1   # background worker (PR 6): stock pull, cart holds, ERP documents, later courier sync, e-mail, reports
PROFILE_CADDY_RAM_GB=1;    PROFILE_CADDY_CPU=1
PROFILE_OS_RAM_GB=11                                # never squeezed
PROFILE_PG_EFFECTIVE_CACHE_GB=40
PROFILE_PG_LIMIT_HEADROOM_PCT=25    # container limit = shared_buffers + this %, so backends never get OOM-killed
PROFILE_PG_MAX_CONNECTIONS=100      # kept low; PgBouncer in front
PROFILE_PGBOUNCER_POOL=40
PROFILE_PG_WORK_MEM_MB=32           # web queries; the report pool gets its own (PR 603)
PROFILE_PG_REPORT_WORK_MEM_MB=256
PROFILE_PG_SLOW_MS=100              # slow query log threshold (PR 603)

# --- Backups (PR 8). Retention is a setting; the admin will own it later (PR 507). ---
BACKUP_TIME="02:30"                 # daily full backup, local time
BACKUP_KEEP_LOCAL_DAYS=7
BACKUP_KEEP_BLOB_DAYS=35
BACKUP_KEEP_DRIVE_DAYS=30           # by age, only while BACKUP_DRIVE_KEEP is 0
BACKUP_DRIVE_KEEP=3                 # PR 395 (CN-030): Drive keeps the newest this many checked backups (the admin's
                                    # Backups page sets it, backups.drive.keepCopies; 0 = by days as above)
BACKUP_MEDIA="yes"                  # the product photos on the local disk ($EXTAS_ROOT/data/media) are in every daily backup
BACKUP_MEDIA_FULL_EVERY_DAYS=7      # a full photo archive at least this often (and never less often than the shortest
                                    # BACKUP_KEEP_*); the days between carry only what changed since the full one
PG_ARCHIVE_TIMEOUT_S=60             # WAL segment at least every minute → point-in-time restore to the minute
BACKUP_REQUEST_STALE_H=12          # PR 507: an admin request the server never reported is failed after this
ORIGIN_CERT_MIN_DAYS=7             # PR 397: an origin certificate that ends sooner is not used (the automatic one serves)
# PR 402: the first-week watch (Settings → System → Go-live; extas-first-week, hourly). The texts of its daily check.
FIRST_WEEK_DAILY_TITLE="📋 প্রথম সপ্তাহ, দিন %s/%s — দোকানের দৈনিক খবর"
FIRST_WEEK_L_HEALTH="সার্ভার"
FIRST_WEEK_L_SMOKE="সব পাতা (smoke test)"
FIRST_WEEK_L_BACKUP="রাতের ব্যাকআপ"
FIRST_WEEK_OK="ঠিক আছে"
FIRST_WEEK_PROBLEM="সমস্যা"
FIRST_WEEK_PASS="পাস"
FIRST_WEEK_FAIL="ব্যর্থ"
FIRST_WEEK_PAGES="পাতা"
FIRST_WEEK_NONE="এখনও চলেনি"
FIRST_WEEK_END_TEXT="✅ প্রথম সপ্তাহের নজরদারি শেষ — এখন থেকে রাতের smoke test আর সাধারণ সতর্কবার্তা চলবে।"
RESTORE_STAGING_VALID_H=24         # PR 396: production only after the check copy of the same backup passed this recently
RESTORE_LOCK_WAIT_S=3600           # PR 396: a restore, test or drill waits this long for one already running, then gives up
RESTORE_PROD_OK_TEXT="♻️ দোকানের ডেটাবেস ব্যাকআপ থেকে ফেরানো হয়েছে। আগের ডেটা সার্ভারে রাখা আছে।"
RESTORE_PROD_FAIL_TEXT="🚨 দোকানের ডেটাবেস ফেরানো যায়নি। আগের ডেটা যেমন ছিল তেমনই আছে"

BACKUP_TELEGRAM_OK_TEXT="✅ রাতের ব্যাকআপ ঠিক আছে — সার্ভার, Blob আর ড্রাইভের কপি মিলিয়ে দেখা হয়েছে।"
BACKUP_DRILL_OK_TEXT="✅ মাসিক ফেরানোর মহড়া ঠিক আছে — ব্যাকআপ থেকে দোকান ফেরানো যায়।"
BACKUP_KEEP_LOCAL_WAL_DAYS=2        # archived WAL kept on the data disk (point-in-time restore here; Blob keeps the rest).
                                    # Every base backup carries the WAL it needs itself, so older ones still restore.
BACKUP_MIN_FREE_PCT=20              # before each backup the backup disk is pruned until this much is free (the newest
                                    # base backup, dump and photo set always stay)
RESTORE_TEST_WAIT_MIN=30            # the restore test waits this long for the restored copy to finish its WAL replay
BACKUP_IMMUTABLE="no"               # PR 385 (B6.1): "yes" once the Blob container is locked (immutability policy of at
                                    # least BACKUP_KEEP_BLOB_DAYS, a lifecycle rule that removes copies after it, and a
                                    # server key that may add and read but never delete — docs/security/BREAK-GLASS-RESTORE.md
                                    # §1). Then the server never deletes in Blob and proves every day that a delete is refused.

# --- The repository's docs on the server (PR 594, CN-011) ---
DOCS_KEEP_VERSIONS=5                # copies of README.md + docs/ kept in $EXTAS_ROOT/docs (one per deployed commit)

# --- Smoke test after every deploy and every night (CN-016, PR 4/17) ---
SMOKE_CHECK_EMAIL="smoke-check@check.invalid"   # the read-only check account (.invalid never receives mail)
SMOKE_CHECK_NAME="Smoke check"
SMOKE_PLAYWRIGHT_VERSION="1.63.0"   # the browser image the smoke test runs in (extas-smoke:<version>, built once)
SMOKE_TIMEOUT_MIN=15                # a run that takes longer is a failure

# --- Monitoring (PR 9) ---
MONITOR_SLOW_MS=2000                # site response slower than this raises an alert
MONITOR_BACKUP_MAX_AGE_H=26
MONITOR_REPEAT_MIN=30               # repeat an unresolved alert at most this often

# --- The vault's keys for the server's scripts (PR 392): extas-vault-sync ---
VAULT_SYNC_EVERY_MIN=2              # how often the server asks the vault (an unchanged vault decrypts nothing)
VAULT_SYNC_TIMEOUT_MIN=3            # a run that takes longer is stopped and reported
VAULT_SYNC_TELEGRAM_HELLO="✅ EXTAS: টেলিগ্রাম যুক্ত হয়েছে — সার্ভার আর ব্যাকআপের খবর এখন থেকে এখানে আসবে।"

# --- k6 baseline (PR 10) ---
K6_VUS=50
K6_DURATION="30s"

# --- Container images (pinned) ---
IMG_POSTGRES="postgres:17"
IMG_REDIS="redis:7.4-alpine"
IMG_MEILI="getmeili/meilisearch:v1.15"
IMG_CADDY="caddy:2.10-alpine"
IMG_ALPINE="alpine:3.22"
IMG_K6="grafana/k6:1.0.0"
