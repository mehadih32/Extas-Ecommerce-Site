# EXTAS server configuration — the ONE config file for the server (PR 604, A2.9.5, A2.9.15).
# Shell-sourceable KEY=VALUE. No secrets here, ever: secrets are generated on the server
# (/srv/extas/config/secrets, mode 600) or typed into the admin vault by the owner (PR 493).
# Changing a value here and pushing to main re-runs server-setup.yml, which is idempotent.

# --- Where the build is served (CN-003). The domain is a setting, never code. ---
EXTAS_STAGING_HOST="new.extas.com.bd"
EXTAS_STAGING_USER="extas"          # login name for the preview password; the password is generated on the server
EXTAS_NOINDEX="yes"                 # staging is never indexed
EXTAS_PREVIEW_COOKIE_DAYS=30        # after the preview login the browser keeps a cookie this long and is not asked again

# --- Machine basics (PR 3) ---
EXTAS_TIMEZONE="Asia/Dhaka"
EXTAS_HOSTNAME="extas-vm"
EXTAS_AUTO_REBOOT="yes"             # unattended security updates may reboot when a kernel needs it
EXTAS_AUTO_REBOOT_TIME="04:30"      # local time (EXTAS_TIMEZONE)
EXTAS_UFW_CLOUDFLARE_ONLY="no"      # yes = 80/443 accept Cloudflare IP ranges only (A2.9.14, optional)

# --- Paths (A2.9.3) ---
EXTAS_ROOT="/srv/extas"             # data disk (LVM) — permanent
EXTAS_NVME_MOUNT="/mnt/nvme"        # local NVMe — temporary, raw after every stop (PR 601)
EXTAS_VG="extas"                    # LVM volume group on the 1 TB data disk

# --- Data-disk volumes in GiB (PR 1, 3). Free space stays in the VG for growth. ---
LV_POSTGRES_GB=250
LV_DOCKER_GB=200
LV_REDIS_GB=20
LV_SEARCH_GB=30
LV_MEDIA_GB=100                      # local storage adapter fallback only; media normally lives on Azure Blob
LV_BACKUP_GB=150
LV_LOGS_GB=30
LV_BASE_GB=10                       # /srv/extas itself: config, secrets, certificates, state, reports, the stack
LV_SWAP_GB=16
EXTAS_DISK_ALARM_PCT=80             # alert when any volume passes this (PR 9)

# --- Hardware-aware profile (PR 604). Reference split for 8 vCPU / 64 GB (A2.9.5).
# On another machine every value is scaled from these by detected CPU and RAM; nothing is edited by hand. ---
PROFILE_REF_CPU=8
PROFILE_REF_RAM_GB=64
PROFILE_PG_RAM_GB=16;      PROFILE_PG_CPU=3
PROFILE_REDIS_RAM_GB=6;    PROFILE_REDIS_CPU=1      # split: cache (LRU) 4 GB + queue (no eviction) 2 GB
PROFILE_REDIS_QUEUE_SHARE_PCT=33.34
PROFILE_MEILI_RAM_GB=4;    PROFILE_MEILI_CPU=1
PROFILE_APP_RAM_GB=16;     PROFILE_APP_CPU=6;  PROFILE_APP_REPLICAS=6
PROFILE_APP_HEAP_PCT=75                             # Node heap per replica, % of its memory limit (rest: buffers, sharp)
PROFILE_WORKER_RAM_GB=6;   PROFILE_WORKER_CPU=2     # image / video worker, separate process
PROFILE_JOBS_RAM_GB=4;     PROFILE_JOBS_CPU=1       # courier sync, e-mail, reports
PROFILE_CADDY_RAM_GB=1;    PROFILE_CADDY_CPU=1
PROFILE_OS_RAM_GB=11                                # never squeezed
PROFILE_PG_EFFECTIVE_CACHE_GB=40
PROFILE_PG_LIMIT_HEADROOM_PCT=25    # container limit = shared_buffers + this %, so backends never get OOM-killed
PROFILE_PG_MAX_CONNECTIONS=100      # kept low; PgBouncer in front
PROFILE_PGBOUNCER_POOL=40
PROFILE_PG_WORK_MEM_MB=32           # web queries; the report pool gets its own (PR 603)
PROFILE_PG_REPORT_WORK_MEM_MB=256
PROFILE_PG_SLOW_MS=100              # slow query log threshold (PR 603)

# --- Backups (PR 8). Retention is a setting; the admin will own it later (PR 507). ---
BACKUP_TIME="02:30"                 # daily full backup, local time
BACKUP_KEEP_LOCAL_DAYS=7
BACKUP_KEEP_BLOB_DAYS=35
BACKUP_KEEP_DRIVE_DAYS=30
PG_ARCHIVE_TIMEOUT_S=60             # WAL segment at least every minute → point-in-time restore to the minute

# --- Monitoring (PR 9) ---
MONITOR_SLOW_MS=2000                # site response slower than this raises an alert
MONITOR_BACKUP_MAX_AGE_H=26
MONITOR_REPEAT_MIN=30               # repeat an unresolved alert at most this often

# --- k6 baseline (PR 10) ---
K6_VUS=50
K6_DURATION="30s"

# --- Container images (pinned) ---
IMG_POSTGRES="postgres:17"
IMG_REDIS="redis:7.4-alpine"
IMG_MEILI="getmeili/meilisearch:v1.15"
IMG_CADDY="caddy:2.10-alpine"
IMG_ALPINE="alpine:3.22"
IMG_K6="grafana/k6:1.0.0"
